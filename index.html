<!DOCTYPE html>
<html lang="pt-BR" class="sem-js">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nosso Namoro</title>
<meta name="description" content="Um cantinho para guardar a nossa história.">
<meta name="theme-color" content="#0D1F3C">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Inter:wght@300;400;500;600&family=Pinyon+Script&display=swap">
<link rel="stylesheet" href="css/style.css">

<!-- Marca que o JS está vivo. Sem isso, um erro de script deixaria a página
     em branco: os estados iniciais invisíveis só valem quando há JS. -->
<script>document.documentElement.className = "com-js";</script>
</head>
<body>

<!-- ==================== TELA DE ENTRADA ==================== -->
<div class="entrada" id="entrada">

  <!-- O céu da entrada. As estrelas e a lua são CSS; as nuvens são o desenho
       de assets/elementos, cada uma numa pose.
       Tudo aqui é decoração: o bloco inteiro é aria-hidden. -->
  <div class="entrada__ceu" aria-hidden="true">
    <span class="lua"></span>
    <span class="nuvem nuvem--entrada-1"></span>
    <span class="nuvem nuvem--entrada-2 nuvem--densa"></span>
  </div>

  <div class="entrada__conteudo">
    <h1 class="entrada__titulo" id="entradaTitulo">&nbsp;</h1>
    <button type="button" class="coracao" id="btnEntrar">
      <span class="coracao__texto">Entrar</span>
    </button>
  </div>
</div>

<main class="conteudo" id="conteudo">

  <!-- ==================== TOPO: A LUA, AS NUVENS E O MAR ====================
       A primeira coisa depois do clique, e só desenho — daí o aria-hidden no
       bloco inteiro. A lua cheia entre as nuvens lá em cima e as ondas
       fechando embaixo. -->
  <div class="topo" aria-hidden="true">
    <span class="lua lua--topo"></span>
    <span class="nuvem nuvem--topo-1"></span>
    <span class="nuvem nuvem--topo-2"></span>
    <span class="nuvem nuvem--topo-3 nuvem--densa"></span>

    <div class="mar">
      <span class="mar__onda mar__onda--fundo"></span>
      <span class="mar__onda mar__onda--meio"></span>
      <span class="mar__onda mar__onda--frente"></span>
    </div>
  </div>

  <!-- ==================== TRILHA ====================
       Nasce escondida: quem a mostra é o js/trilha.js, depois de sortear a
       música e a foto. Sem JS não há trilha, e a barra não aparece vazia. -->
  <header class="trilha" id="trilha" hidden>
    <div class="trilha__caixa">

      <!-- sem src aqui de propósito: src="" faz o navegador rebaixar a
           própria página. Quem põe a foto sorteada é o trilha.js. -->
      <img class="trilha__capa" id="trilhaCapa" alt="">

      <div class="trilha__texto">
        <span class="trilha__titulo" id="trilhaTitulo"></span>
        <span class="trilha__artista" id="trilhaArtista"></span>
      </div>

      <div class="trilha__controles">
        <button type="button" class="trilha__botao" id="trilhaAnterior" aria-label="Música anterior">&lsaquo;</button>
        <button type="button" class="trilha__botao trilha__botao--tocar" id="trilhaTocar" aria-label="Tocar a música">&#9654;</button>
        <button type="button" class="trilha__botao" id="trilhaProxima" aria-label="Próxima música">&rsaquo;</button>
      </div>

      <!-- preload="none": nada é baixado antes de ela entrar -->
      <audio id="trilhaAudio" preload="none" loop></audio>

    </div>
  </header>

  <!-- ==================== ABERTURA: O RECADO E O ABRAÇO ====================
       A primeira seção depois do clique. O recado e a mídia saem do objeto
       `abertura` em data/momentos.js; quem monta a máscara que abre ao rolar é
       o js/abertura.js, usando o componente do js/scroll-mask.js.

       O quadro nasce vazio de propósito: sem JS não há máscara, e aí o CSS
       esconde a caixa em vez de deixar um buraco de duas telas na página. -->
  <section class="secao secao--abraco" id="secaoAbraco">

    <!-- Os bichos do fundo do mar (bloco 6B do CSS). Daqui para baixo, cada
         seção recebe os seus: <span> vazio, aria-hidden e sempre atrás do
         conteúdo. Quem diz o tamanho, o canto e o compasso de cada um é a
         folha de estilo — aqui só se diz QUEM está na seção.
         Os marcados com "borda" só aparecem em tela larga, na margem que
         sobra dos dois lados da coluna. -->
    <span class="bicho bicho--peixe bicho--peixe-abraco" aria-hidden="true"></span>

    <h2 class="secao__titulo abraco__recado" id="abracoRecado">&nbsp;</h2>
    <p class="abraco__dica" id="abracoDica"></p>
    <div class="abraco__quadro" id="abracoQuadro"></div>
  </section>

  <!-- ==================== CONTADOR ==================== -->
  <section class="secao secao--contador" id="secaoContador" data-revelar>

    <span class="bicho bicho--nemo" aria-hidden="true"></span>
    <span class="alga alga--azul alga--contador-1" aria-hidden="true"></span>
    <span class="alga alga--vermelha alga--contador-2" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--contador-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--contador-2" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-contador" aria-hidden="true"></span>
    <span class="alga alga--azul borda borda--esq alga--borda-contador" aria-hidden="true"></span>
    <span class="bicho bicho--peixe borda borda--dir bicho--peixe-borda-contador" aria-hidden="true"></span>

    <h2 class="secao__titulo">Nosso contador</h2>
    <p class="secao__linha"></p>

    <div class="contador">
      <article class="cartao cartao--principal">
        <span class="coracao-pulsa" aria-hidden="true"></span>
        <span class="cartao__rotulo">Dias namorando</span>
        <strong class="cartao__numero" id="diasNamoro">—</strong>
        <span class="cartao__unidade">dias</span>
        <span class="cartao__desde">desde 22 de maio de 2026</span>
        <p class="cartao__detalhe" id="detalheNamoro"></p>
      </article>
    </div>

    <p class="contador__relogio" id="relogioVivo" aria-live="off"></p>
  </section>

  <!-- ==================== TIMELINE ==================== -->
  <section class="secao" id="secaoTimeline" data-revelar>

    <span class="bicho bicho--dory" aria-hidden="true"></span>
    <span class="alga alga--vermelha alga--timeline" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--timeline-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--timeline-2" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--dir estrela-mar--borda-timeline-1" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-timeline-2" aria-hidden="true"></span>
    <span class="alga alga--vermelha borda borda--dir alga--borda-timeline" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--dir estrela-mar--borda-timeline-3" aria-hidden="true"></span>
    <span class="bicho bicho--peixe borda borda--esq bicho--peixe-borda-timeline" aria-hidden="true"></span>

    <h2 class="secao__titulo">Os nossos marcos</h2>
    <p class="secao__linha"></p>
    <ol class="timeline" id="timelineLista"></ol>
  </section>

  <!-- ==================== CALENDÁRIO ==================== -->
  <section class="secao" id="secaoCalendario" data-revelar>

    <span class="bicho bicho--peixonauta" aria-hidden="true"></span>
    <span class="bicho bicho--peixe bicho--peixe-calendario" aria-hidden="true"></span>
    <span class="alga alga--azul alga--calendario" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--calendario-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--calendario-2" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-calendario" aria-hidden="true"></span>
    <span class="alga alga--vermelha borda borda--esq alga--borda-calendario" aria-hidden="true"></span>
    <span class="bicho bicho--peixe borda borda--dir bicho--peixe-borda-calendario" aria-hidden="true"></span>

    <h2 class="secao__titulo">Nosso calendário</h2>
    <p class="secao__subtitulo">Os dias marcados guardam alguma coisa nossa. Toca para ver.</p>

    <div class="cal">
      <header class="cal__topo">
        <button type="button" class="cal__seta" id="calAnterior" aria-label="Mês anterior">&lsaquo;</button>
        <h3 class="cal__mes" id="calMes" aria-live="polite">&nbsp;</h3>
        <button type="button" class="cal__seta" id="calProximo" aria-label="Próximo mês">&rsaquo;</button>
      </header>

      <div class="cal__semana" aria-hidden="true">
        <span>D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span>S</span>
      </div>

      <div class="cal__grade" id="calGrade"></div>

      <!-- o recado dos dias sem foto; fica escondido até ela tocar num deles -->
      <p class="cal__recado" id="calRecado" role="status" hidden></p>
    </div>
  </section>

  <!-- ==================== GALERIA ==================== -->
  <section class="secao" id="secaoGaleria" data-revelar>

    <span class="bicho bicho--peixe bicho--peixe-galeria" aria-hidden="true"></span>
    <span class="alga alga--vermelha alga--galeria" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--galeria-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--galeria-2" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-galeria-1" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--dir estrela-mar--borda-galeria-2" aria-hidden="true"></span>
    <span class="alga alga--azul borda borda--dir alga--borda-galeria" aria-hidden="true"></span>
    <span class="bicho bicho--peixe borda borda--dir bicho--peixe-borda-galeria" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-galeria-3" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--dir estrela-mar--borda-galeria-4" aria-hidden="true"></span>

    <h2 class="secao__titulo">Todas as nossas fotos</h2>
    <p class="secao__subtitulo" id="galeriaContagem"></p>
    <div class="galeria" id="galeria"></div>
  </section>

  <!-- ==================== MÚSICA ====================
       O player do Spotify é só para ver e abrir a playlist — quem toca
       sozinho é a trilha lá de cima. -->
  <section class="secao" id="secaoMusica" data-revelar>

    <span class="bicho bicho--peixe bicho--peixe-musica" aria-hidden="true"></span>
    <span class="alga alga--azul alga--musica" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--musica-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--musica-2" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--esq estrela-mar--borda-musica-1" aria-hidden="true"></span>
    <span class="estrela-mar borda borda--dir estrela-mar--borda-musica-2" aria-hidden="true"></span>
    <span class="alga alga--vermelha borda borda--esq alga--borda-musica" aria-hidden="true"></span>

    <h2 class="secao__titulo">A nossa playlist</h2>
    <p class="secao__subtitulo">Todas as músicas, para ouvir com calma depois.</p>
    <div class="player">
      <iframe
        src="https://open.spotify.com/embed/playlist/2tCktWMXFeq2Um3Gybs314"
        width="100%" height="352" frameborder="0" loading="lazy"
        title="Nossa playlist no Spotify"
        allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </section>

  <!-- O fim da página é o chão do mar. A ordem aqui importa: a areia vem
       primeiro, e quem vier depois dela é desenhado por cima — o Gary
       atravessando, o Bob de pé na areia, as algas plantadas e as estrelas
       caídas. -->
  <footer class="rodape">
    <span class="areia" aria-hidden="true"></span>
    <span class="gary" aria-hidden="true"></span>
    <span class="bicho bicho--bob bicho--bob-rodape" aria-hidden="true"></span>
    <span class="alga alga--azul alga--rodape-1" aria-hidden="true"></span>
    <span class="alga alga--vermelha alga--rodape-2" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--rodape-1" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--rodape-2" aria-hidden="true"></span>
    <span class="estrela-mar estrela-mar--rodape-3" aria-hidden="true"></span>

    <span class="rodape__coracao" aria-hidden="true">&#10084;</span>
    <p id="rodapeTexto"></p>
  </footer>

</main>

<!-- ==================== LIGHTBOX (um só, usado pelo calendário e pela galeria) ==================== -->
<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Foto ampliada" hidden>
  <button type="button" class="lightbox__fechar" id="lbFechar" aria-label="Fechar">&times;</button>
  <button type="button" class="lightbox__seta lightbox__seta--ant" id="lbAnterior" aria-label="Anterior">&lsaquo;</button>

  <figure class="lightbox__figura">
    <div class="lightbox__midia" id="lbMidia"></div>
    <figcaption class="lightbox__legenda">
      <span id="lbLegenda"></span>
      <span class="lightbox__posicao" id="lbPosicao"></span>
    </figcaption>
  </figure>

  <button type="button" class="lightbox__seta lightbox__seta--prox" id="lbProximo" aria-label="Próxima">&rsaquo;</button>
</div>

<script src="data/momentos.js"></script>
<script src="js/lightbox.js"></script>
<script src="js/contador.js"></script>
<script src="js/croma-card.js"></script>
<script src="js/particle-text.js"></script>
<script src="js/scroll-mask.js"></script>
<script src="js/abertura.js"></script>
<script src="js/timeline.js"></script>
<script src="js/calendario.js"></script>
<script src="js/galeria.js"></script>
<script src="js/trilha.js"></script>
<script src="js/app.js"></script>
</body>
</html>
